[project]
name = "salary-management-api"
version = "0.1.0"
description = "Salary management backend for ACME HR"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic[email]>=2.9.0",
    "pydantic-settings>=2.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx2>=0.28.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    # Warnings from this codebase are failures, not noise.
    "error",
    # Raised inside Starlette's own TestClient import, from anyio. Nothing here
    # can fix it, and silencing it by exact message keeps every other warning
    # fatal rather than blanket-disabling deprecation warnings.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN", "N"]
ignore = ["ANN401"]
# En dashes and middle dots are intentional in user-facing labels (salary bands,
# level names), so they are declared rather than silencing the confusables rule.
allowed-confusables = ["–", "—", "·"]

[tool.ruff.lint.per-file-ignores]
# Test functions are discovered by pytest, never called by typed code, so return
# annotations on them add noise without adding safety. Argument annotations are
# likewise supplied by parametrize and fixtures.
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
